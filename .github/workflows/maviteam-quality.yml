name: MaviTeam Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - maviteam/**

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TeamSync

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: TeamSync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        continue-on-error: true
        run: npm run audit:prod

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Export web build
        run: npm run export:web

  functions:
    name: Functions checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TeamSync/functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TeamSync/functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint
