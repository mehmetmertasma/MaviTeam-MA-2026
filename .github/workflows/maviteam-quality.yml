name: MaviTeam Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - maviteam/**

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TeamSync

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: TeamSync/package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
